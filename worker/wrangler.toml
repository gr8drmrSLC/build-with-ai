name = "build-with-ai-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# KV namespace for rate limiting
# To set up:
#   1. wrangler kv:namespace create RATE_LIMIT_KV
#   2. Replace the id below with the output from that command
#   3. wrangler secret put ANTHROPIC_API_KEY
#
# Until KV is configured, the worker runs without rate limiting.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
